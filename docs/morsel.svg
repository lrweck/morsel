<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>

  <text x="24" y="34" fill="#1f2328" font-size="17" font-weight="600">morsel-driven parallelism</text>
  <text x="24" y="55" fill="#656d76" font-size="12.5">fixed-size morsels &#183; per-worker queues &#183; work stealing &#183; elastic workers</text>

  <!-- source -->
  <rect x="24" y="150" width="140" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="94" y="142" fill="#656d76" font-size="13" text-anchor="middle">source</text>
  <text x="94" y="292" fill="#656d76" font-size="12.5" text-anchor="middle">morsel = 256 items</text>

  <!-- queues -->
  <g fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="275" y="102" width="90" height="120" rx="10"/>
    <rect x="435" y="102" width="90" height="120" rx="10"/>
    <rect x="595" y="102" width="90" height="120" rx="10"/>
    <rect x="755" y="102" width="90" height="120" rx="10"/>
  </g>
  <g fill="#656d76" font-size="13" text-anchor="middle">
    <text x="320" y="96">queue</text>
    <text x="480" y="96">queue</text>
    <text x="640" y="96">queue</text>
    <text x="800" y="96">queue</text>
  </g>

  <!-- workers -->
  <circle cx="320" cy="300" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#ffffff;#ddf4ff;#ddf4ff;#ffffff;#ffffff" keyTimes="0;0.20;0.30;0.72;0.80;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#8c959f;#8c959f;#0969da;#0969da;#8c959f;#8c959f" keyTimes="0;0.20;0.30;0.72;0.80;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="300" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#ffffff;#ddf4ff;#ddf4ff;#ffffff;#ffffff" keyTimes="0;0.26;0.36;0.74;0.82;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#8c959f;#8c959f;#0969da;#0969da;#8c959f;#8c959f" keyTimes="0;0.26;0.36;0.74;0.82;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="300" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#ffffff;#ddf4ff;#ddf4ff;#ffffff;#ffffff" keyTimes="0;0.32;0.42;0.76;0.84;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#8c959f;#8c959f;#0969da;#0969da;#8c959f;#8c959f" keyTimes="0;0.32;0.42;0.76;0.84;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="300" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#ffffff;#ddf4ff;#ddf4ff;#ffffff;#ffffff" keyTimes="0;0.68;0.78;0.90;0.96;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#8c959f;#8c959f;#0969da;#0969da;#8c959f;#8c959f" keyTimes="0;0.68;0.78;0.90;0.96;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">
    <text x="320" y="305">W0</text>
    <text x="480" y="305">W1</text>
    <text x="640" y="305">W2</text>
    <text x="800" y="305">W3</text>
  </g>
  <text x="800" y="360" fill="#656d76" font-size="12.5" text-anchor="middle">idle
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.66;0.74;0.94;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- steal annotation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.92;1" dur="8s" repeatCount="indefinite"/>
    <path d="M370 300 C 560 190, 660 190, 764 292" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M764 292 l-12 -2 l6 -11 z" fill="#1a7f37"/>
    <text x="565" y="196" fill="#1a7f37" font-size="12.5" text-anchor="middle">steal from a busy worker</text>
  </g>

  <!-- morsels: base position is the source centre (94,210) -->
  <g id="m1">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0,0; 0,0; 226,-80; 226,-80; 226,90; 226,90" keyTimes="0; 0.04; 0.14; 0.38; 0.52; 1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.04; 0.06; 0.66; 0.72; 1"/>
    <rect x="70" y="196" width="48" height="28" rx="7" fill="#0969da"/>
    <circle cx="86" cy="210" r="2.6" fill="#ffffff"/><circle cx="102" cy="210" r="2.6" fill="#ffffff"/>
  </g>
  <g id="m2">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0,0; 0,0; 386,-80; 386,-80; 386,90; 386,90" keyTimes="0; 0.08; 0.20; 0.44; 0.58; 1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.08; 0.10; 0.70; 0.76; 1"/>
    <rect x="70" y="196" width="48" height="28" rx="7" fill="#0969da"/>
    <circle cx="86" cy="210" r="2.6" fill="#ffffff"/><circle cx="102" cy="210" r="2.6" fill="#ffffff"/>
  </g>
  <g id="m3">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0,0; 0,0; 546,-80; 546,-80; 546,90; 546,90" keyTimes="0; 0.12; 0.26; 0.50; 0.64; 1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.12; 0.14; 0.76; 0.82; 1"/>
    <rect x="70" y="196" width="48" height="28" rx="7" fill="#0969da"/>
    <circle cx="86" cy="210" r="2.6" fill="#ffffff"/><circle cx="102" cy="210" r="2.6" fill="#ffffff"/>
  </g>
  <!-- m4 lands on W0's queue and is later stolen by the idle W3 -->
  <g id="m4">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0,0; 0,0; 226,-50; 226,-50; 706,90; 706,90" keyTimes="0; 0.16; 0.30; 0.62; 0.76; 1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.16; 0.18; 0.86; 0.92; 1"/>
    <rect x="70" y="196" width="48" height="28" rx="7" fill="#1a7f37"/>
    <circle cx="86" cy="210" r="2.6" fill="#ffffff"/><circle cx="102" cy="210" r="2.6" fill="#ffffff"/>
  </g>
</svg>

  <text x="36" y="52" font-size="21" font-weight="700" fill="#e6edf3">morsel-driven parallelism</text>
  <text x="36" y="78" font-size="13" fill="#8b949e">all workers take work &#183; different speeds &#183; an idle worker steals</text>

